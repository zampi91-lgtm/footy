<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Footy">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Footy</title>
<style>
  :root { --bg: #000; --fg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #hud { pointer-events: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--fg); font: 16px/1 monospace; letter-spacing: 2px; }
  /* touch controls: a stick wherever the left thumb lands, buttons under the right thumb */
  #touch { position: fixed; inset: 0; touch-action: none; font: bold 3.6vh/1 monospace; color: var(--fg); }
  #tzone { position: absolute; left: 0; top: 0; width: 45%; height: 100%; }
  #tbase { position: absolute; left: calc(26vh + env(safe-area-inset-left)); top: calc(100% - 26vh); width: 35vh; height: 35vh; margin: -17.5vh 0 0 -17.5vh; border: 0.5vh solid var(--fg); border-radius: 50%; background: rgba(0, 0, 0, 0.3); box-sizing: border-box; pointer-events: none; opacity: 0.35; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 12vh; height: 12vh; margin: -6vh 0 0 -6vh; border-radius: 50%; background: var(--fg); }
  .tb { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5vh; border: 0.6vh solid var(--fg); border-radius: 50%; background: rgba(0, 0, 0, 0.55); box-sizing: border-box; touch-action: none; }
  #t-swap svg, #t-swap b { mix-blend-mode: difference; color: #fff; }
  .tb.on { background: var(--fg); color: var(--bg); }
  .tb b { font: bold 2.2vh/1 monospace; letter-spacing: 0.2vh; pointer-events: none; }
  .tb svg { width: 48%; height: 48%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* right thumb arc: SHOOT is the anchor in the corner, the moves you use most sit one thumb-roll away */
  #t-shoot { right: calc(4vh + env(safe-area-inset-right)); bottom: 4vh; width: 27vh; height: 27vh; border-width: 0.8vh; outline: 0.35vh solid var(--fg); outline-offset: 0.7vh; }
  #t-shoot svg { width: 52%; height: 52%; }
  #t-pass { right: calc(35vh + env(safe-area-inset-right)); bottom: 3vh; width: 22vh; height: 22vh; }
  #t-thru { right: calc(5vh + env(safe-area-inset-right)); bottom: 36vh; width: 20vh; height: 20vh; }
  #t-swap { right: calc(30vh + env(safe-area-inset-right)); bottom: 29vh; width: 17vh; height: 17vh; }
  #t-trick { right: calc(61vh + env(safe-area-inset-right)); bottom: 5vh; width: 17vh; height: 17vh; }
  #t-pause { right: calc(4vh + env(safe-area-inset-right)); top: 14vh; width: 10vh; height: 10vh; border-radius: 2.4vh; border-width: 0.4vh; background: rgba(0, 0, 0, 0.3); }
  #t-pause svg { width: 50%; height: 50%; }
  #t-ok { right: calc(5vh + env(safe-area-inset-right)); bottom: 8vh; width: 24vh; height: 24vh; }
  #t-back { right: calc(33vh + env(safe-area-inset-right)); bottom: 6vh; width: 18vh; height: 18vh; }
  body.menu .g, body.play .m { display: none; }
  body.edit .g { border-style: dashed; }
  body.edit #t-ok { right: auto; left: calc(50% + 2vh); bottom: auto; top: 3vh; width: 15vh; height: 15vh; }
  body.edit #t-back { right: calc(50% + 2vh); bottom: auto; top: 3vh; width: 15vh; height: 15vh; font-size: 3vh; }
  #rot { display: none; position: fixed; inset: 0; background: var(--bg); color: var(--fg); font: bold 18px/1.6 monospace; place-items: center; text-align: center; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rot { display: grid; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="load">LOADING THE CAGE...</div>
<div id="rot">TURN YOUR PHONE<br>SIDEWAYS TO PLAY</div>
<script src="js/gl.js"></script>
<script src="js/ui.js"></script>
<script src="js/geo.js"></script>
<script src="js/arena.js"></script>
<script src="js/player.js"></script>
<script src="js/ball.js"></script>
<script src="js/tricks.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
